schema: comparevi/fork-lane-instance@v1
lifecycle:
  status: active
  started_at: '2026-03-31'

issue:
  number: 1000
  title: replace with issue title
  lane: fork-standing-priority

policy:
  purpose: local-regression-lane
  fork_remote_proof: false
  upstream_remote_proof: true
  rule: >
    Catch regressions locally on the fork branch first. Only mount proven commits
    onto the upstream integration branch for remote self-hosted evidence.

forks:
  selected: personal
  catalog:
    - id: personal
      repository: svelderrainruiz/compare-vi-cli-action
      local_remote: origin
      branch: issue/1000-short-description
      operator_owned: true
      purpose: local-regression
    - id: org-shadow
      repository: LabVIEW-Community-CI-CD/compare-vi-cli-action-fork
      branch: issue/1000-short-description
      operator_owned: true
      purpose: alternate-fork

upstream:
  repository: LabVIEW-Community-CI-CD/compare-vi-cli-action
  integration_branch: integration/pester-service-model
  standing_priority_issue: 1

service_model:
  target_workflow: pester-gate.yml
  decomposition_layers:
    - pester-context
    - pester-runtime-preflight
    - pester-selection
    - pester-execute
    - pester-post
  first_slice:
    mounted_commit: 0123456789abcdef0123456789abcdef01234567
    summary:
      - replace with the first mounted slice summary

local_validation:
  install:
    - node tools/npm/cli.mjs ci
  checks:
    - node --test tools/priority/__tests__/pester-service-model-workflow-contract.test.mjs
    - node tools/lint-markdown.mjs
    - ./bin/actionlint -color .github/workflows/pester-context.yml .github/workflows/pester-gate.yml .github/workflows/pester-run.yml .github/workflows/pester-evidence.yml
    - git diff --check

upstream_proof:
  dispatch:
    workflow: pester-gate.yml
    ref: integration/pester-service-model
    inputs:
      checkout_repository: LabVIEW-Community-CI-CD/compare-vi-cli-action
      checkout_ref: integration/pester-service-model
  latest_run:
    id: 1
    url: https://github.com/LabVIEW-Community-CI-CD/compare-vi-cli-action/actions/runs/1

notes:
  - Keep instance manifests as durable evidence even after the issue closes.
  - Keep fork-only control files off the upstream integration rail unless promoted intentionally.
